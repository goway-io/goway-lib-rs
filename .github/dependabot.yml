# Weekly dependency updates, minor and patch grouped into one PR per ecosystem; majors come one by one.
# Internal packages (goway-lib, goway-events, goway-lib-rs) are moved by hand with the service that needs them.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tashkent"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "goway-lib"
      - dependency-name: "goway-events"
      - dependency-name: "goway-lib-rs"
      - dependency-name: "goway_lib"
      - dependency-name: "goway_events"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tashkent"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
