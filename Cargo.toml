[package]
name = "goway-lib-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
async-nats = "0.50.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
constant_time_eq = "0.6.0"
dotenvy = "0.15.7"
envy = "0.4.2"
futures-util = "0.3.34"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
sentry = { version = "0.49.2", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls-no-provider", "tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[lib]
name = "goway_lib"
path = "src/lib.rs"
